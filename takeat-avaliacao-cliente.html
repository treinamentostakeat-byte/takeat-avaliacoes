<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takeat — Avalie seu Atendimento</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#C8131B;
  --bg:#0b0b0b;--bg2:#131313;--bg3:#1c1c1c;
  --txt:#f0f0f0;--txt2:rgba(240,240,240,0.55);--txt3:rgba(240,240,240,0.28);
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.11);
}
html,body{
  min-height:100vh;background:var(--bg);
  font-family:'Inter',sans-serif;color:var(--txt);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 90% 55% at 50% 0%,rgba(200,19,27,0.07) 0%,transparent 65%);
}

.card{
  position:relative;z-index:1;
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:24px;overflow:hidden;
  width:100%;max-width:400px;text-align:center;
}
.card-bar{height:3px;background:linear-gradient(90deg,var(--red),rgba(200,19,27,.2),transparent)}
.card-body{padding:40px 32px 36px}

.logo{height:36px;display:block;margin:0 auto 32px}

.question{font-size:clamp(17px,4vw,22px);font-weight:800;letter-spacing:-.4px;line-height:1.3;margin-bottom:36px}
.question em{color:var(--red);font-style:normal}

/* CARINHAS */
.faces{display:flex;justify-content:center;gap:20px;margin-bottom:32px}

.face-btn{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  background:none;border:none;cursor:pointer;padding:0;
  transition:transform .15s;
}
.face-btn:hover .face-circle{transform:scale(1.1)}
.face-btn:active .face-circle{transform:scale(.94)}

.face-circle{
  width:80px;height:80px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:3px solid transparent;
  transition:all .2s;
  position:relative;
}

/* cores de cada carinha */
.face-btn[data-v="1"] .face-circle{background:#3d1c1c;border-color:#7a2222}
.face-btn[data-v="2"] .face-circle{background:#3a2e10;border-color:#7a6020}
.face-btn[data-v="3"] .face-circle{background:#1a3520;border-color:#2d7a4a}

/* selecionado */
.face-btn[data-v="1"].sel .face-circle{background:#5c1f1f;border-color:#e05252;box-shadow:0 0 22px rgba(224,82,82,.35)}
.face-btn[data-v="2"].sel .face-circle{background:#5a4510;border-color:#e0a030;box-shadow:0 0 22px rgba(224,160,48,.35)}
.face-btn[data-v="3"].sel .face-circle{background:#1f5030;border-color:#3dbd6e;box-shadow:0 0 22px rgba(61,189,110,.35)}

/* SVG carinhas */
.face-circle svg{width:48px;height:48px}

.face-label{
  font-size:12px;font-weight:700;letter-spacing:.04em;
  color:var(--txt3);transition:color .2s;
}
.face-btn[data-v="1"].sel .face-label{color:#e05252}
.face-btn[data-v="2"].sel .face-label{color:#e0a030}
.face-btn[data-v="3"].sel .face-label{color:#3dbd6e}

/* SEPARADOR */
.sep{height:1px;background:var(--border);margin-bottom:22px}

/* COMENTÁRIO */
.comment-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);display:block;text-align:left;margin-bottom:6px}
textarea{
  width:100%;background:var(--bg3);border:1px solid var(--border2);
  border-radius:10px;color:var(--txt);font-family:inherit;
  font-size:14px;padding:11px 13px;resize:none;height:76px;
  transition:border-color .15s;
}
textarea:focus{border-color:var(--red);outline:none}
textarea::placeholder{color:var(--txt3)}

/* BOTÃO */
.send-btn{
  width:100%;background:var(--red);color:#fff;
  font-size:15px;font-weight:800;padding:14px;
  border-radius:12px;border:none;cursor:pointer;
  transition:all .2s;margin-top:16px;
  opacity:.35;pointer-events:none;
}
.send-btn.ready{opacity:1;pointer-events:all}
.send-btn.ready:hover{filter:brightness(1.1);transform:translateY(-1px)}
.send-btn.ready:active{transform:scale(.98)}

.status{font-size:12px;color:var(--txt3);margin-top:8px;min-height:16px;text-align:center}
.status.err{color:#ff7070}

/* SUCESSO */
.success{display:none}
.s-ring{
  width:76px;height:76px;border-radius:50%;
  background:rgba(61,189,110,.1);border:2px solid rgba(61,189,110,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:36px;margin:0 auto 18px;
}
.success h3{font-size:22px;font-weight:900;margin-bottom:8px}
.success p{font-size:14px;color:var(--txt2);line-height:1.6;margin-bottom:22px}
.nova-btn{
  background:var(--bg3);color:var(--txt2);font-size:13px;font-weight:600;
  padding:9px 22px;border-radius:10px;border:1px solid var(--border2);
  cursor:pointer;transition:all .15s;
}
.nova-btn:hover{color:#fff;border-color:rgba(255,255,255,.2)}

/* FOOTER */
.footer{
  position:relative;z-index:1;margin-top:18px;
  font-size:11px;color:var(--txt3);
  display:flex;align-items:center;gap:5px;
}
.footer em{color:var(--red);font-style:normal;font-weight:700}
</style>
</head>
<body>

        <button class="face-btn" data-v="2" onclick="select(2)">
          <div class="face-circle">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="50" cy="50" r="48" fill="#d4881a" opacity=".9"/>
              <circle cx="35" cy="38" r="6" fill="#fff"/>
              <circle cx="65" cy="38" r="6" fill="#fff"/>
              <line x1="32" y1="65" x2="68" y2="65" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="face-label">Regular</span>
        </button>

              <circle cx="50" cy="50" r="48" fill="#27ae60" opacity=".9"/>

              <circle cx="65" cy="38" r="6" fill="#fff"/>
              <path d="M32 58 Q50 76 68 58" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBwJT4fsTdOIMyb8Ju55WoLheZRsvYv4kw",
  authDomain: "takeat-avaliacoes.firebaseapp.com",
  projectId: "takeat-avaliacoes",
  storageBucket: "takeat-avaliacoes.firebasestorage.app",
  messagingSenderId: "516277196228",
  appId: "1:516277196228:web:0867685e6df5030008c091"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window._salvar = async function(av){
  await addDoc(collection(db,"avaliacoes"),{...av,criadoEm:serverTimestamp()});
};
</script>

<script>
var nota = 0;
var LABELS = {1:'Ruim', 2:'Regular', 3:'Ótimo'};

function select(n){
  nota = n;
  document.querySelectorAll('.face-btn').forEach(function(b){
    b.classList.toggle('sel', parseInt(b.dataset.v) === n);
  });
  document.getElementById('send-btn').classList.add('ready');
}

async function enviar(){
  if(!nota) return;
  var btn = document.getElementById('send-btn');
  var msg = document.getElementById('status-msg');
  btn.classList.remove('ready');
  btn.textContent = 'Enviando…';

  var av = {
    nota: nota,
    label: LABELS[nota],
    comentario: document.getElementById('f-coment').value.trim(),
    data: new Date().toISOString().split('T')[0]
  };

  try{
    if(typeof window._salvar !== 'function'){
      await new Promise(function(r){setTimeout(r,2000);});
    }
    await window._salvar(av);
    document.getElementById('main-wrap').style.display = 'none';
    document.getElementById('success-wrap').style.display = 'block';
  }catch(e){
    msg.textContent = 'Erro ao enviar. Tente novamente.';
    msg.className = 'status err';
    btn.textContent = 'Enviar avaliação';
    btn.classList.add('ready');
    console.error(e);
  }
}

function reset(){
  nota = 0;
  document.querySelectorAll('.face-btn').forEach(function(b){b.classList.remove('sel');});
  document.getElementById('f-coment').value = '';
  document.getElementById('send-btn').classList.remove('ready');
  document.getElementById('send-btn').textContent = 'Enviar avaliação';
  document.getElementById('status-msg').textContent = '';
  document.getElementById('main-wrap').style.display = 'block';
  document.getElementById('success-wrap').style.display = 'none';
}
</script>
</body>
